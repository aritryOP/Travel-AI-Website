[build]
command = "npm run build"
functions = "netlify/functions"
publish = ".next"

[dev]
command = "npm run dev"
port = 3000

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/api/*"
[headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"
